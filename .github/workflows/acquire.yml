name: Acquire data
# Downloads the CFPB complaint archive and commits the small sample and count files it makes.
on: workflow_dispatch
permissions:
  contents: write
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run notebook 01
        run: jupyter nbconvert --to notebook --execute --inplace --ExecutePreprocessor.timeout=-1 notebooks/01_acquire.ipynb
      - name: Commit the data files
        run: |
          git config user.name "Aditya Khetarpal"
          git config user.email "80028073+AdityaKhetarpal@users.noreply.github.com"
          git add data/*.parquet notebooks/01_acquire.ipynb
          git commit -m "Data: CFPB complaints sample and counts (Jan 2025 to Aug 2026)" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
